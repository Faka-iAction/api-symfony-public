framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default, which is kept for local
        # development and the tests. Production uses Valkey (below).

        # Namespaced pools use the above "app" backend by default
        #pools:
            #my.dedicated.cache: null

# Production keeps the app cache in Valkey, which speaks the Redis protocol, so every
# application node and worker sees the same values: the rate limiters, the daily cap on
# one-time codes (DailyDeliveryCap) and the signal of messenger:stop-workers. Nothing in it
# is a system of record; losing it loses only counts and cached values.
when@prod:
    framework:
        cache:
            app: cache.adapter.redis
            default_redis_provider: '%env(CACHE_DSN)%'
